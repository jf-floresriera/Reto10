# Compila el APK de EVA Explorer y lo deja como artefacto en la pestaña Actions.
name: Compilar APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "data/raw/**"
      - "docs/**"
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No se descargan los objetos LFS (el shapefile de 80 MB): la app solo usa el GeoJSON liviano.
      - id: checkout
        uses: actions/checkout@v5

      - id: java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - id: android
        name: Instalar Android SDK
        run: |
          SDK="${ANDROID_HOME:-$HOME/android-sdk}"
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSL -o /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt
            rm -rf "$SDK/cmdline-tools/latest"
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-35" "build-tools;34.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - id: gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (debug)
        env:
          DATOS_APP_TOKEN: ${{ secrets.DATOS_APP_TOKEN }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log || {
            grep -E '^e: |error:|What went wrong|ERROR:' -A3 build.log | head -60 | while IFS= read -r line; do
              echo "::error title=Gradle::${line}"
            done
            exit 1
          }

      - name: Renombrar APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/EvaExplorer-${GITHUB_REF_NAME//\//-}-${GITHUB_SHA::7}.apk"
          ls -la dist

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: EvaExplorer-apk
          path: dist/*.apk
          retention-days: 30

      - name: Reportar error como comentario del commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Falló la compilación del APK"
            echo '```'
            if [ -f build.log ]; then
              (grep -E '^e: |^w: .*error|What went wrong|ERROR|FAILED|Could not' -A4 build.log || tail -n 80 build.log) | head -n 120
            else
              echo "No existe build.log: falló un paso antes de Gradle."
              echo "checkout=${{ steps.checkout.outcome }} java=${{ steps.java.outcome }} android=${{ steps.android.outcome }} gradle=${{ steps.gradle.outcome }}"
            fi
            echo '```'
          } > comment.md
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" -F body=@comment.md
